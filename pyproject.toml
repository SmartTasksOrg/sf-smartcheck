[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartcheck"
version = "3.0.0"
description = "Check before you sign off. Catch the AI when it's confidently wrong."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SmartTasks Lab" }]
keywords = ["smart", "ai", "iaiso", "sf-smartcheck", "devtools"]
dependencies = []

[project.urls]
Homepage = "https://smarttasks.cloud"
Standard = "https://iaiso.org"
Repository = "https://github.com/SmartTasksOrg/sf-smartcheck"

[project.scripts]
sf-smartcheck = "sf_smartcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
