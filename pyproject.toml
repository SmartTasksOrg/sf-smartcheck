[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartcheck"
version = "3.0.0"
description = "Check before you sign off. Catch the AI when it's confidently wrong."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "SmartTasks Lab" }]
keywords = ["smart", "ai", "iaiso", "sf-smartcheck", "devtools"]
dependencies = []
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://smarttasks.cloud"
Source = "https://github.com/SmartTasksOrg/sf-smartcheck"
Issues = "https://github.com/SmartTasksOrg/sf-smartcheck/issues"
Security = "https://github.com/SmartTasksOrg/sf-smartcheck/security/policy"
Changelog = "https://github.com/SmartTasksOrg/sf-smartcheck/blob/master/CHANGELOG.md"
Standard = "https://iaiso.org"

[project.scripts]
sf-smartcheck = "sf_smartcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
