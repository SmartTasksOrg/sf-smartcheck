name: "SmartCheck"
description: "Flag confident-but-unsourced AI output: unsourced numbers, contradictions, hedging, seeded errors."
branding:
  icon: shield
  color: purple
inputs:
  path:
    description: "File to check"
    required: false
    default: "."
  package:
    description: "Optional pip requirement or path to install instead. Leave empty (the default) to install the copy of SmartCheck this action was taken from, at the ref the workflow names, so nothing is fetched from a package index by name."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install SmartCheck from this action's own repository
      shell: bash
      env:
        PKG: ${{ inputs.package }}
      run: |
        # Installs from this action's own checkout, i.e. the version you pinned in
        # `uses:`. Never by the name "smartcheck" (without sf-): a package of that name is not ours.
        if [ -z "$PKG" ]; then
          PKG="$GITHUB_ACTION_PATH/../.."
          if [ ! -f "$PKG/pyproject.toml" ]; then
            echo "SmartCheck source not found next to the action ($PKG); set the 'package' input" >&2
            exit 1
          fi
        fi
        python -m pip install --quiet "$PKG"
    - shell: bash
      env:
        INPUT_VALUE: ${{ inputs.path }}
      run: python "$GITHUB_ACTION_PATH/../adapter.py" --file "$INPUT_VALUE"
